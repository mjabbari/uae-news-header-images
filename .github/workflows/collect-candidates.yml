name: Collect curation candidates

# Runs when curation/request.txt changes (or manually). Produces curation/candidates.json for hand-picking.
on:
  push:
    paths: ["curation/request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Search Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 curation/collect_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "header-images-bot"
          git config user.email "bot@users.noreply.github.com"
          git add curation/candidates.json
          git commit -m "Curation candidates $(date -u +%F)" || echo "no change"
          git push
