name: Header images (daily)

on:
  schedule:
    - cron: "15 2 * * *"   # 06:15 Gulf Standard Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch photos from Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 fetch_images.py
      - name: Commit images.json
        run: |
          git config user.name "header-images-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images.json
          git commit -m "Update header images $(date -u +%F)" || echo "no change"
          git push
